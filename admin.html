<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Creador de Invitaciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            background: #fff;
            padding: 25px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1,
        h2 {
            color: #333;
            text-align: center;
        }

        .seccion {
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="url"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .grid-colores {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #25d366;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #1eb857;
        }

        #link-generado {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #e7f7ed;
            border: 1px solid #25d366;
            border-radius: 6px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Creador de Invitación Personalizada</h1>

        <form id="form-invitacion">
            <div class="seccion">
                <h2>1. Datos Principales</h2>
                <label>ID Unico del Evento (ej: moira-2-anios):</label>
                <input type="text" id="eventId" required placeholder="moira-2-anios">

                <label>Nombre del Cumpleañero/a:</label>
                <input type="text" id="nombre" required placeholder="Moira">

                <label>Subtítulo / Edades:</label>
                <input type="text" id="subtitulo" placeholder="¡MIS 2 AÑITOS!">

                <label>Fecha del Evento:</label>
                <input type="date" id="fecha" required>

                <label>Horario:</label>
                <input type="text" id="horario" placeholder="DE 13 A 16 HS">

                <label>Lugar / Salón:</label>
                <input type="text" id="lugar" placeholder="SALÓN DE FIRESTONE">

                <label>Ubicación / Dirección:</label>
                <input type="text" id="direccion" placeholder="Colectora y Camino de cintura, Llavallol">

                <label>Enlace de Google Maps (Cómo Llegar):</label>
                <input type="url" id="linkMaps" placeholder="https://maps.google.com/...">
            </div>

            <div class="seccion">
                <h2>2. Temática y Estilos Visuales</h2>
                <div class="grid-colores">
                    <div>
                        <label>Color Fondo:</label>
                        <input type="color" id="colorFondo" value="#d4effc">
                    </div>
                    <div>
                        <label>Color Botones:</label>
                        <input type="color" id="colorBoton" value="#8ecae6">
                    </div>
                    <div>
                        <label>Color Texto:</label>
                        <input type="color" id="colorTexto" value="#0369a1">
                    </div>
                </div>

                <label>Fuente Tipográfica:</label>
                <select id="fuente">
                    <option value="'Fredoka', sans-serif">Infantil / Divertida (Fredoka)</option>
                    <option value="'Comic Neue', cursive">Cómics (Comic Neue)</option>
                    <option value="'Montserrat', sans-serif">Moderna / Elegante (Montserrat)</option>
                </select>
            </div>

            <div class="seccion">
                <h2>3. Imágenes de Personajes y Multimedia</h2>
                <label>URL Personajes Banner Principal (PNG transparente):</label>
                <input type="url" id="personajeHeader" placeholder="https://.../frozen-header.png">

                <label>URL Personaje Separador (ej: Olaf):</label>
                <input type="url" id="personajeSeparador" placeholder="https://.../olaf.png">

                <label>URLs Galería de Fotos (Separadas por coma):</label>

                <textarea id="galeriaFotos" rows="3"
                    placeholder="https://.../foto1.jpg, https://.../foto2.jpg"></textarea>

                <label>URL Música de Fondo (MP3):</label>
                <input type="url" id="musica" placeholder="https://.../cancion.mp3">
            </div>

            <div class="seccion">
                <h2>4. Confirmación por WhatsApp</h2>
                <label>Teléfono 1 (sin +):</label>
                <input type="text" id="whatsapp1" placeholder="5491112345678">
                <label>Nombre Contacto 1:</label>
                <input type="text" id="nombreContacto1" placeholder="Victoria">

                <label>Teléfono 2 (Opcional):</label>
                <input type="text" id="whatsapp2" placeholder="5491118765432">
                <label>Nombre Contacto 2:</label>
                <input type="text" id="nombreContacto2" placeholder="Cory">
            </div>

            <button type="submit">Guardar y Generar Invitación</button>
        </form>

        <div id="link-generado">
            <p>¡Invitación creada con éxito!</p>
            <a id="url-final" href="#" target="_blank" style="font-weight: bold; color: #007bff;">Ver Invitación</a>
        </div>
    </div>

    <script>
        document.getElementById('form-invitacion').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                id: document.getElementById('eventId').value.trim(),
                nombre: document.getElementById('nombre').value,
                subtitulo: document.getElementById('subtitulo').value,
                fecha: document.getElementById('fecha').value,
                horario: document.getElementById('horario').value,
                lugar: document.getElementById('lugar').value,
                direccion: document.getElementById('direccion').value,
                linkMaps: document.getElementById('linkMaps').value,
                estilos: {
                    colorFondo: document.getElementById('colorFondo').value,
                    colorBoton: document.getElementById('colorBoton').value,
                    colorTexto: document.getElementById('colorTexto').value,
                    fuente: document.getElementById('fuente').value
                },
                multimedia: {
                    personajeHeader: document.getElementById('personajeHeader').value,
                    personajeSeparador: document.getElementById('personajeSeparador').value,
                    galeria: document.getElementById('galeriaFotos').value.split(',').map(url => url.trim()).filter(url => url),
                    musica: document.getElementById('musica').value
                },
                confirmacion: {
                    tel1: document.getElementById('whatsapp1').value,
                    nombre1: document.getElementById('nombreContacto1').value,
                    tel2: document.getElementById('whatsapp2').value,
                    nombre2: document.getElementById('nombreContacto2').value
                }
            };

            const res = await fetch('/api/eventos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                const url = `${window.location.origin}/invitacion.html?id=${data.id}`;
                document.getElementById('url-final').href = url;
                document.getElementById('url-final').innerText = url;
                document.getElementById('link-generado').style.display = 'block';
            }
        });
    </script>
</body>

</html>
