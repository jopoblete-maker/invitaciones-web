<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Creador de Invitaciones</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .admin-card {
            max-width: 650px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            margin: 20px 0 15px 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="password"],
        input[type="color"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="time"]:focus,
        input[type="password"]:focus {
            border-color: #0d9488;
        }

        input[type="file"] {
            width: 100%;
            font-size: 0.88rem;
            margin-bottom: 4px;
        }

        .help-text {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .btn-submit {
            width: 100%;
            background-color: #0d9488;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0f766e;
        }

        #resultBox {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        #resultBox.success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        #resultBox.error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        #resultBox a {
            color: #0d9488;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="admin-card">
        <h1>Panel de Control de Invitaciones</h1>
        <p class="subtitle">Completa el formulario para generar la invitación personalizada</p>

        <form id="adminForm">
            <!-- 1. Seguridad y Acceso -->
            <div class="section-title">1. Autorización y Registro</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="adminPassword">Clave de Acceso:</label>
                    <input type="password" id="adminPassword" placeholder="Clave entregada por el admin" required>
                </div>
                <div class="form-group">
                    <label for="idEvento">ID Único del Evento:</label>
                    <input type="text" id="idEvento" placeholder="Ej: luis-50" required>
                    <span class="help-text">Este ID formará el enlace web único.</span>
                </div>
            </div>

            <!-- 2. Datos del Evento -->
            <div class="section-title">2. Información del Evento</div>
            <div class="form-group">
                <label for="nombre">Título / Nombre Principal:</label>
                <input type="text" id="nombre" placeholder="Ej: MOIRA" required>
            </div>
            <div class="form-group">
                <label for="subtitulo">Subtítulo / Agasajado:</label>
                <input type="text" id="subtitulo" placeholder="Ej: Mis 60 Años">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fecha">Fecha del Evento:</label>
                    <input type="date" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="horario">Horario:</label>
                    <input type="text" id="horario" placeholder="Ej: 13:00 a 17:00 hs">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="lugar">Lugar / Salón:</label>
                    <input type="text" id="lugar" placeholder="Ej: Salon Stadium">
                </div>
                <div class="form-group">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" placeholder="Ej: Belgrano 205">
                </div>
            </div>

            <div class="form-group">
                <label for="linkMaps">Enlace de Google Maps:</label>
                <input type="text" id="linkMaps" placeholder="https://maps.app.goo.gl/...">
            </div>

            <!-- 3. Personalización Visual -->
            <div class="section-title">3. Estilos Visuales</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="colorFondo">Color de Fondo:</label>
                    <input type="color" id="colorFondo" value="#ffffff">
                </div>
                <div class="form-group">
                    <label for="colorTexto">Color de Texto:</label>
                    <input type="color" id="colorTexto" value="#333333">
                </div>
                <div class="form-group">
                    <label for="colorBoton">Color de Botones:</label>
                    <input type="color" id="colorBoton" value="#0d9488">
                </div>
            </div>

            <!-- 4. Archivos Multimedia -->
            <div class="section-title">4. Archivos y Multimedia</div>

            <div class="form-group">
                <label for="fileHeader">Imagen Principal / Banner:</label>
                <input type="file" id="fileHeader" accept="image/*">
                <input type="text" id="urlHeader" placeholder="O pega la URL directa de la imagen">
            </div>

            <div class="form-group">
                <label for="fileSeparador">Imagen Separadora / Ícono:</label>
                <input type="file" id="fileSeparador" accept="image/*">
                <input type="text" id="urlSeparador" placeholder="O pega la URL directa de la imagen">
            </div>

            <div class="form-group">
                <label for="fileGaleria">Galería de Fotos:</label>
                <input type="file" id="fileGaleria" accept="image/*" multiple>
                <input type="text" id="urlGaleria" placeholder="O pega URLs separadas por coma">
            </div>

            <div class="form-group">
                <label for="fileMusica">Música de Fondo (MP3):</label>
                <input type="file" id="fileMusica" accept="audio/*">
                <input type="text" id="urlMusica" placeholder="O pega la URL directa del audio (.mp3)">
            </div>

            <!-- 5. Confirmación por WhatsApp -->
            <div class="section-title">5. Confirmación por WhatsApp</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="tel1">Teléfono 1 (con código de país, ej: 5491157339281):</label>
                    <input type="text" id="tel1" placeholder="Ej: 5491157339281">
                </div>
                <div class="form-group">
                    <label for="nombre1">Nombre Contacto 1:</label>
                    <input type="text" id="nombre1" placeholder="Ej: Dese">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tel2">Teléfono 2 (Opcional):</label>
                    <input type="text" id="tel2" placeholder="Ej: 5491157339281">
                </div>
                <div class="form-group">
                    <label for="nombre2">Nombre Contacto 2:</label>
                    <input type="text" id="nombre2" placeholder="Ej: Cares">
                </div>
            </div>

            <button type="submit" class="btn-submit">Guardar y Generar Invitación</button>
        </form>

        <div id="resultBox"></div>
    </div>

    <script>
        // Convertir archivo local a Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'none';

            try {
                // Procesar imágenes y audio
                const headerFile = document.getElementById('fileHeader').files[0];
                const separadorFile = document.getElementById('fileSeparador').files[0];
                const musicaFile = document.getElementById('fileMusica').files[0];
                const galeriaFiles = Array.from(document.getElementById('fileGaleria').files);

                const headerBase64 = headerFile ? await fileToBase64(headerFile) : null;
                const separadorBase64 = separadorFile ? await fileToBase64(separadorFile) : null;
                const musicaBase64 = musicaFile ? await fileToBase64(musicaFile) : null;

                let galeriaArr = [];
                if (galeriaFiles.length > 0) {
                    for (let file of galeriaFiles) {
                        const b64 = await fileToBase64(file);
                        if (b64) galeriaArr.push(b64);
                    }
                }

                // Si ingresó URLs manuales, agregarlas/usarlas
                const urlHeader = document.getElementById('urlHeader').value.trim();
                const urlSeparador = document.getElementById('urlSeparador').value.trim();
                const urlMusica = document.getElementById('urlMusica').value.trim();
                const urlGaleria = document.getElementById('urlGaleria').value.trim();

                if (urlGaleria) {
                    const urls = urlGaleria.split(',').map(u => u.trim()).filter(u => u.length > 0);
                    galeriaArr = galeriaArr.concat(urls);
                }

                const id = document.getElementById('idEvento').value.trim();

                const payload = {
                    password: document.getElementById('adminPassword').value.trim(),
                    id: id,
                    nombre: document.getElementById('nombre').value.trim(),
                    subtitulo: document.getElementById('subtitulo').value.trim(),
                    fecha: document.getElementById('fecha').value,
                    horario: document.getElementById('horario').value.trim(),
                    lugar: document.getElementById('lugar').value.trim(),
                    direccion: document.getElementById('direccion').value.trim(),
                    linkMaps: document.getElementById('linkMaps').value.trim(),
                    estilos: {
                        colorFondo: document.getElementById('colorFondo').value,
                        colorTexto: document.getElementById('colorTexto').value,
                        colorBoton: document.getElementById('colorBoton').value
                    },
                    multimedia: {
                        personajeHeader: headerBase64 || urlHeader || '',
                        personajeSeparador: separadorBase64 || urlSeparador || '',
                        musica: musicaBase64 || urlMusica || '',
                        galeria: galeriaArr
                    },
                    confirmacion: {
                        tel1: document.getElementById('tel1').value.trim(),
                        nombre1: document.getElementById('nombre1').value.trim(),
                        tel2: document.getElementById('tel2').value.trim(),
                        nombre2: document.getElementById('nombre2').value.trim()
                    }
                };

                const res = await fetch('/api/eventos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Ocurrió un error al guardar');
                }

                const linkInvitacion = `${window.location.origin}/invitacion.html?id=${data.id}`;
                resultBox.className = 'success';
                resultBox.innerHTML = `
        ✅ <strong>¡Invitación guardada con éxito!</strong><br><br>
        Enlace directo:<br>
        <a href="${linkInvitacion}" target="_blank">${linkInvitacion}</a>
      `;
                resultBox.style.display = 'block';

            } catch (err) {
                resultBox.className = 'error';
                resultBox.innerHTML = `❌ <strong>Error:</strong> ${err.message}`;
                resultBox.style.display = 'block';
            }
        });
    </script>
</body>

</html>
