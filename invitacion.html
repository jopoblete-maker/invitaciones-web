<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#b88746">
    <title>Invitación Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Bebas+Neue&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&family=Dancing+Script&family=Great+Vibes&family=Lato:wght@400;600;700;900&family=Montserrat:wght@500;600;700;800&family=Monsieur+La+Doulaise&family=Pacifico&family=Pinyon+Script&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&family=Prata&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link id="template-stylesheet" rel="stylesheet" href="/css/templates/boda-vertical.css">
</head>

<body>
    <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
        <div class="loading-content">
            <video class="loading-brand" id="loadingBrandVideo" autoplay loop muted playsinline preload="auto"
                aria-label="YCORDIGITAL">
                <source src="assets/ycor-brand.mp4" type="video/mp4">
            </video>
            <div class="loading-indicator" aria-hidden="true"></div>
        </div>
    </div>

    <div id="audioWidget" class="audio-widget is-hidden" aria-label="Reproductor de música">
        <select id="audioTrackSelector" aria-label="Seleccionar pista de audio"></select>
        <button id="btnMusic" class="music-button is-paused" type="button" aria-label="Reproducir música">
            <svg class="music-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M9 18V5l12-2v13h-2V7.35l-8 1.33V18a3 3 0 1 1-2 0Z" />
            </svg>
            <span>Música</span>
        </button>
    </div>
    <audio id="bgMusic" loop></audio>

    <main class="invitation-shell invitation-dashboard" id="app" aria-live="polite"></main>

    <script src="js/core/event-schema.js" defer></script>
    <script src="js/core/event-normalizer.js" defer></script>
    <script src="js/core/template-registry.js" defer></script>
    <script src="js/core/section-renderer.js" defer></script>
    <script src="js/invitacion.js" defer></script>
</body>

</html>
