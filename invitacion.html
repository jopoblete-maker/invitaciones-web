<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b88746">
    <title>Invitación Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lato:wght@400;700;900&family=Mountains+of+Christmas:wght@700&family=Playfair+Display:wght@600;700;800&family=Quicksand:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/invitacion.css">
</head>

<body>
    <div class="page-vignette" aria-hidden="true"></div>

    <button id="btnMusic" class="music-button is-hidden is-paused" type="button" aria-label="Reproducir música">
        <svg class="music-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M9 18V5l12-2v13h-2V7.35l-8 1.33V18a3 3 0 1 1-2 0Z" />
        </svg>
        <span>Música</span>
    </button>
    <audio id="bgMusic" loop></audio>

    <main class="invitation-shell" id="app" aria-live="polite">
        <section class="state-panel">
            <p>Cargando invitación...</p>
        </section>
    </main>

    <script src="js/invitacion.js" defer></script>
</body>

</html>
